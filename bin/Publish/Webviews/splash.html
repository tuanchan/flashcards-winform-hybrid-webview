<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #000000; /* Absolute black background */
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* PAW LOADER */
    .paw-loader {
      width: calc(6*30px);
      height: 50px;
      display: flex;
      color: #ffffff; /* White paws for monochrome design */
      filter: drop-shadow(30px 25px 0 currentColor) drop-shadow(60px 0 0 currentColor) drop-shadow(120px 0 0 currentColor);
      clip-path: inset(0 100% 0 0);
      animation: l12 2s infinite steps(7);
      margin-left: -60px; /* Center adjustment */
    }
    .paw-loader:before {
      content: "";
      width: 30px;
      height: 25px;
      --c:no-repeat radial-gradient(farthest-side,currentColor 92%,#0000);
      background: 
        var(--c) left /70% 70%,
        var(--c) right/20% 20%,
        var(--c) top    0 right 15%/20% 20%,
        var(--c) bottom 0 right 15%/20% 20%;
    }
    @keyframes l12 {
      100% {clip-path: inset(0 -30px 0 0)}
    }

    /* TEXT LOADER */
    .text-loader {
      width: fit-content;
      font-size: 36px;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      color: #0000;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.8);
      --l:#0000 45%, #fff 0 55%, #0000 0;
      --g:0/300% 100% no-repeat text;
      background: 
        linear-gradient(-60deg,var(--l)) var(--g),
        linear-gradient( 60deg,var(--l)) var(--g);
      animation: l7 3s linear infinite;
      letter-spacing: 2px;
      text-align: center;
    }
    .text-loader:before {
      content: "WELCOME FLASH CARDS APP";
    }
    @keyframes l7 {
      0%  {background-position: 100%,0   }
      50% {background-position: 0   ,0   }
      to  {background-position: 0   ,100%}
    }

    .status {
      color: #8e92a2; /* Flat grey matching app's unified-muted */
      font-size: 14px;
      font-weight: 600;
      margin-top: -10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="paw-loader"></div>
    <div class="text-loader"></div>
    <div class="status" id="statusText">Đang khởi tạo hệ thống...</div>
  </div>

  <script>
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', e => {
        const msg = e.data;
        if (msg && msg.text) {
          document.getElementById('statusText').textContent = msg.text;
        }
      });
    }
  </script>
</body>
</html>
